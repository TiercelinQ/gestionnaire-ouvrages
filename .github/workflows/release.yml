name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    # electron-builder --win: the packaging target is Windows only.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Four values must agree. package.json is canonical, config.ts mirrors it
      # (rules/versioning.md), the changelog anchors the release notes, and the
      # tag is placed by hand, which is where a divergence appears.
      - name: Verify version consistency
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:TAG_NAME -replace '^v', ''
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Select-String -Path src/shared/config.ts -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $changelogTop = (Select-String -Path docs/release/CHANGELOG.md -Pattern '^## \[([0-9]+\.[0-9]+\.[0-9]+)\]' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "tag=$tagVersion  package.json=$pkgVersion  config.ts=$appVersion  changelog=$changelogTop"
          if ($tagVersion -ne $pkgVersion) { Write-Error "Tag '$tagVersion' != package.json '$pkgVersion'"; exit 1 }
          if ($appVersion -ne $pkgVersion) { Write-Error "config.ts APP_VERSION '$appVersion' != package.json '$pkgVersion'"; exit 1 }
          if ($changelogTop -ne $pkgVersion) { Write-Error "CHANGELOG '$changelogTop' != package.json '$pkgVersion'"; exit 1 }
          Write-Host "Version consistency OK: $pkgVersion"

      # --publish never is mandatory here. Run on a tag, electron-builder
      # triggers an implicit publish of its own and fails with "GitHub Personal
      # Access Token is not set", after having built the installers correctly.
      # Publishing belongs to the release step below, which attaches the notes
      # extracted from the changelog.
      - name: Build and package (electron-builder)
        run: npm run dist -- --publish never

      - name: Extract changelog section
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          # Explicit encodings: the changelog is French and accented. Reading it
          # as ANSI turns "Corrigé" into "CorrigÃ©" in the release body, and a
          # BOM would surface as a stray character on the first line.
          $lines = Get-Content docs/release/CHANGELOG.md -Encoding utf8
          $body = @(); $inSection = $false
          foreach ($line in $lines) {
            if ($line -match "^## \[$([regex]::Escape($version))\]") { $inSection = $true; continue }
            elseif ($inSection -and $line -match "^## ") { break }
            elseif ($inSection) { $body += $line }
          }
          ($body -join "`n").Trim() | Out-File -FilePath release_notes.md -Encoding utf8NoBOM
          Get-Content release_notes.md

      # A glob, never a fixed name: the artifact is named after productName
      # ("Gestionnaire Ouvrage"), not after the npm package name. It picks up
      # the NSIS installer and the portable build, and leaves out .blockmap,
      # latest.yml and win-unpacked/.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: release/*.exe
