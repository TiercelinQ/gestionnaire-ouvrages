version: 2
updates:
  # Dependances npm (package.json + package-lock.json).
  # Groupees : sans "groups", un projet Electron ouvre une pull request par
  # paquet. Le job "quality" tourne sur chacune d'elles.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-dependencies:
        patterns: ["*"]

  # Actions GitHub epinglees dans les workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
